name: Build and Release Executables

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/tests.yml

  build:
    name: Build ${{ matrix.platform }} editions
    runs-on: ${{ matrix.os }}
    needs: checks
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
          - os: ubuntu-24.04
            platform: Linux
          - os: macos-14
            platform: macOS

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Derive Version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            RAW="${GITHUB_REF_NAME}"
            CLEAN="${RAW#v}"
            if [[ ! "$CLEAN" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid release version" >&2
              exit 1
            fi
          else
            RAW="manual-${GITHUB_RUN_NUMBER}"
            CLEAN="0.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "raw=$RAW" >> "$GITHUB_OUTPUT"
          echo "version=$CLEAN" >> "$GITHUB_OUTPUT"
          echo "clean=${CLEAN%%-*}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ "$RUNNER_OS" = "Windows" ]; then
            python -m pip install -r requirements-windows-py312.lock
          else
            python -m pip install -r requirements-build.txt
          fi
          python -m pip check

      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Verify assets and collect licences
        shell: bash
        run: |
          python tools/prepare_release.py --assets --notices build/release-notices

      - name: Check tag matches application version
        if: github.ref_type == 'tag'
        shell: bash
        run: test "$(python main.py --version)" = "${{ steps.ver.outputs.version }}"

      - name: Build all editions
        shell: bash
        run: |
          mkdir -p dist
          for EDITION in full headmouse-only dwell-click session-viewer; do
            PYINSTALLER_ARGS=(--noconfirm --clean --onefile)
            if [ "$RUNNER_OS" = "Windows" ]; then
              PYINSTALLER_ARGS+=(--windowed)
            fi

            case "$EDITION" in
              full)
                APP_NAME="OpenHeadMouse"
                ENTRY_POINT="main.py"
                ;;
              headmouse-only)
                APP_NAME="OpenHeadMouseHeadOnly"
                ENTRY_POINT="main.py"
                PYINSTALLER_ARGS+=(--exclude-module fitts_law --exclude-module session_viewer)
                ;;
              dwell-click)
                APP_NAME="DwellClick"
                ENTRY_POINT="dwell_click/__main__.py"
                ;;
              session-viewer)
                APP_NAME="SessionViewer"
                ENTRY_POINT="session_viewer/__main__.py"
                ;;
            esac

            PYINSTALLER_ARGS+=(--name "$APP_NAME")
            if [ "$RUNNER_OS" = "Windows" ]; then
              PYINSTALLER_ARGS+=(--add-data "build/release-notices;release-notices")
            else
              PYINSTALLER_ARGS+=(--add-data "build/release-notices:release-notices")
            fi
            if [ "$EDITION" = "full" ] || [ "$EDITION" = "headmouse-only" ]; then
              if [ "$RUNNER_OS" = "Windows" ]; then
                PYINSTALLER_ARGS+=(
                  --add-data "config.json;."
                  --add-data "models/face_landmarker.task;models"
                )
              else
                PYINSTALLER_ARGS+=(
                  --add-data "config.json:."
                  --add-data "models/face_landmarker.task:models"
                )
              fi
              if [ "$RUNNER_OS" = "macOS" ]; then
                PYINSTALLER_ARGS+=(--add-data "providers/airpods/swift_src/main.swift:providers/airpods/swift_src")
              fi
              PYINSTALLER_ARGS+=(
                --hidden-import mediapipe.tasks.c
                --collect-binaries mediapipe
              )
            fi
            if [ "$EDITION" = "full" ] || [ "$EDITION" = "session-viewer" ]; then
              if [ "$RUNNER_OS" = "Windows" ]; then
                PYINSTALLER_ARGS+=(--add-data "models/canonical_face_model.obj;models")
              else
                PYINSTALLER_ARGS+=(--add-data "models/canonical_face_model.obj:models")
              fi
            fi
            if [ "$RUNNER_OS" = "Linux" ]; then
              xvfb-run -a python -m PyInstaller "${PYINSTALLER_ARGS[@]}" "$ENTRY_POINT"
            else
              python -m PyInstaller "${PYINSTALLER_ARGS[@]}" "$ENTRY_POINT"
            fi

            if [ "$RUNNER_OS" = "Windows" ]; then
              EXTENSION=".exe"
              case "$EDITION" in
                full) BINARY_NAME="OpenHeadMouse-windows-amd64.exe" ;;
                headmouse-only) BINARY_NAME="OpenHeadMouse-headmouse-only-windows-amd64.exe" ;;
                dwell-click) BINARY_NAME="DwellClick-windows-amd64.exe" ;;
                session-viewer) BINARY_NAME="SessionViewer-windows-amd64.exe" ;;
              esac
            elif [ "$RUNNER_OS" = "Linux" ]; then
              EXTENSION=""
              case "$EDITION" in
                full) BINARY_NAME="OpenHeadMouse-linux-amd64" ;;
                headmouse-only) BINARY_NAME="OpenHeadMouse-headmouse-only-linux-amd64" ;;
                dwell-click) BINARY_NAME="DwellClick-linux-amd64" ;;
                session-viewer) BINARY_NAME="SessionViewer-linux-amd64" ;;
              esac
            else
              EXTENSION=""
              case "$EDITION" in
                full) BINARY_NAME="OpenHeadMouse-macos-arm64" ;;
                headmouse-only) BINARY_NAME="OpenHeadMouse-headmouse-only-macos-arm64" ;;
                dwell-click) BINARY_NAME="DwellClick-macos-arm64" ;;
                session-viewer) BINARY_NAME="SessionViewer-macos-arm64" ;;
              esac
              test "$(uname -m)" = "arm64"
              test "$(lipo -archs "dist/${APP_NAME}")" = "arm64"
            fi
            mv "dist/${APP_NAME}${EXTENSION}" "dist/${BINARY_NAME}"
          done

      - name: Smoke test packaged apps without input control
        shell: bash
        env:
          QT_QPA_PLATFORM: ${{ runner.os == 'Linux' && 'xcb' || 'offscreen' }}
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          export LOCALAPPDATA="$RUNNER_TEMP/openheadmouse-smoke"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/openheadmouse-smoke"
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a python tools/smoke_release.py dist
          else
            python tools/smoke_release.py dist
          fi

      - name: Build Windows Installers (Inno Setup)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install innosetup --no-progress -y
          $editions = @(
            [pscustomobject]@{
              AppName = "OpenHeadMouse"
              Version = "${{ steps.ver.outputs.clean }}"
              InstallDir = "OpenHeadMouse"
              SetupName = "OpenHeadMouse-windows-amd64-setup"
              Binary = "OpenHeadMouse-windows-amd64.exe"
              ExeName = "OpenHeadMouse.exe"
            },
            [pscustomobject]@{
              AppName = "OpenHeadMouse (HeadMouse-only)"
              Version = "${{ steps.ver.outputs.clean }}"
              InstallDir = "OpenHeadMouse HeadMouse-only"
              SetupName = "OpenHeadMouse-headmouse-only-windows-amd64-setup"
              Binary = "OpenHeadMouse-headmouse-only-windows-amd64.exe"
              ExeName = "OpenHeadMouse.exe"
            },
            [pscustomobject]@{
              AppName = "Dwell Click"
              Version = "${{ steps.ver.outputs.clean }}"
              InstallDir = "Dwell Click"
              SetupName = "DwellClick-windows-amd64-setup"
              Binary = "DwellClick-windows-amd64.exe"
              ExeName = "DwellClick.exe"
            },
            [pscustomobject]@{
              AppName = "Session Viewer"
              Version = "${{ steps.ver.outputs.clean }}"
              InstallDir = "Session Viewer"
              SetupName = "SessionViewer-windows-amd64-setup"
              Binary = "SessionViewer-windows-amd64.exe"
              ExeName = "SessionViewer.exe"
            }
          )
          foreach ($edition in $editions) {
            $script = @"
          [Setup]
          AppName=$($edition.AppName)
          AppVersion=$($edition.Version)
          DefaultDirName={autopf}\$($edition.InstallDir)
          DefaultGroupName=$($edition.AppName)
          OutputDir=dist
          OutputBaseFilename=$($edition.SetupName)
          Compression=lzma
          SolidCompression=yes
          WizardStyle=modern

          [Files]
          Source: "dist\$($edition.Binary)"; DestDir: "{app}"; DestName: "$($edition.ExeName)"; Flags: ignoreversion
          Source: "build\release-notices\*"; DestDir: "{app}\release-notices"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\$($edition.AppName)"; Filename: "{app}\$($edition.ExeName)"
          Name: "{autodesktop}\$($edition.AppName)"; Filename: "{app}\$($edition.ExeName)"
          "@
            Set-Content -Path installer.iss -Value $script -Encoding ASCII
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build Linux .deb packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential
          sudo gem install --no-document fpm
          mkdir -p pkg/usr/local/bin

          VERSION="${{ steps.ver.outputs.clean }}"
          for EDITION in full headmouse-only dwell-click session-viewer; do
            case "$EDITION" in
              full)
                BINARY_NAME="OpenHeadMouse-linux-amd64"
                PACKAGE_NAME="openheadmouse"
                OUTPUT_NAME="OpenHeadMouse-linux-amd64.deb"
                EXECUTABLE_NAME="OpenHeadMouse"
                DESCRIPTION="OpenHeadMouse full edition"
                ;;
              headmouse-only)
                BINARY_NAME="OpenHeadMouse-headmouse-only-linux-amd64"
                PACKAGE_NAME="openheadmouse-headmouse-only"
                OUTPUT_NAME="OpenHeadMouse-headmouse-only-linux-amd64.deb"
                EXECUTABLE_NAME="OpenHeadMouseHeadOnly"
                DESCRIPTION="OpenHeadMouse headmouse-only edition"
                ;;
              dwell-click)
                BINARY_NAME="DwellClick-linux-amd64"
                PACKAGE_NAME="dwell-click"
                OUTPUT_NAME="DwellClick-linux-amd64.deb"
                EXECUTABLE_NAME="DwellClick"
                DESCRIPTION="Dwell Click standalone application"
                ;;
              session-viewer)
                BINARY_NAME="SessionViewer-linux-amd64"
                PACKAGE_NAME="session-viewer"
                OUTPUT_NAME="SessionViewer-linux-amd64.deb"
                EXECUTABLE_NAME="SessionViewer"
                DESCRIPTION="OpenHeadMouse Session Viewer standalone application"
                ;;
            esac
            cp "dist/${BINARY_NAME}" "pkg/usr/local/bin/${EXECUTABLE_NAME}"
            chmod +x "pkg/usr/local/bin/${EXECUTABLE_NAME}"
            mkdir -p "pkg/usr/share/doc/${PACKAGE_NAME}"
            cp -R build/release-notices/. "pkg/usr/share/doc/${PACKAGE_NAME}/"
            fpm -s dir -t deb \
              -n "$PACKAGE_NAME" \
              -v "$VERSION" \
              --architecture amd64 \
              --description "$DESCRIPTION" \
              -C pkg \
              -p "dist/${OUTPUT_NAME}" \
              "usr/local/bin/${EXECUTABLE_NAME}" \
              "usr/share/doc/${PACKAGE_NAME}"
          done

      - name: Build macOS .app bundles and DMGs
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew update
          brew install create-dmg
          VERSION="${{ steps.ver.outputs.clean }}"

          for EDITION in full headmouse-only dwell-click session-viewer; do
            case "$EDITION" in
              full)
                BINARY_NAME="OpenHeadMouse-macos-arm64"
                APP_NAME="OpenHeadMouse"
                DISPLAY_NAME="OpenHeadMouse"
                BUNDLE_ID="io.github.simonjudge.openheadmouse"
                EXECUTABLE_NAME="OpenHeadMouse"
                DMG_NAME="OpenHeadMouse-macos-arm64.dmg"
                VOLUME_NAME="OpenHeadMouse"
                ;;
              headmouse-only)
                BINARY_NAME="OpenHeadMouse-headmouse-only-macos-arm64"
                APP_NAME="OpenHeadMouse-HeadMouse-only"
                DISPLAY_NAME="OpenHeadMouse HeadMouse-only"
                BUNDLE_ID="io.github.simonjudge.openheadmouse.headmouseonly"
                EXECUTABLE_NAME="OpenHeadMouse"
                DMG_NAME="OpenHeadMouse-headmouse-only-macos-arm64.dmg"
                VOLUME_NAME="OpenHeadMouse HeadMouse-only"
                ;;
              dwell-click)
                BINARY_NAME="DwellClick-macos-arm64"
                APP_NAME="DwellClick"
                DISPLAY_NAME="Dwell Click"
                BUNDLE_ID="io.github.simonjudge.dwellclick"
                EXECUTABLE_NAME="DwellClick"
                DMG_NAME="DwellClick-macos-arm64.dmg"
                VOLUME_NAME="Dwell Click"
                ;;
              session-viewer)
                BINARY_NAME="SessionViewer-macos-arm64"
                APP_NAME="SessionViewer"
                DISPLAY_NAME="Session Viewer"
                BUNDLE_ID="io.github.simonjudge.sessionviewer"
                EXECUTABLE_NAME="SessionViewer"
                DMG_NAME="SessionViewer-macos-arm64.dmg"
                VOLUME_NAME="Session Viewer"
                ;;
            esac

            APP_ROOT="dist/${APP_NAME}.app"
            mkdir -p "$APP_ROOT/Contents/MacOS" "$APP_ROOT/Contents/Resources"
            cp "dist/${BINARY_NAME}" "$APP_ROOT/Contents/MacOS/${EXECUTABLE_NAME}"
            chmod +x "$APP_ROOT/Contents/MacOS/${EXECUTABLE_NAME}"
            cp -R build/release-notices "$APP_ROOT/Contents/Resources/"

            cat > "$APP_ROOT/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>${DISPLAY_NAME}</string>
            <key>CFBundleDisplayName</key><string>${DISPLAY_NAME}</string>
            <key>CFBundleIdentifier</key><string>${BUNDLE_ID}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleExecutable</key><string>${EXECUTABLE_NAME}</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>14.0</string>
            <key>NSCameraUsageDescription</key><string>Estimate head movements locally from your camera.</string>
            <key>NSMotionUsageDescription</key><string>Read AirPods head movements through the motion helper.</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

            DMG_ROOT="dmg-root-${EDITION}"
            mkdir -p "$DMG_ROOT"
            cp -R "$APP_ROOT" "$DMG_ROOT/${APP_NAME}.app"
            create-dmg \
              --volname "$VOLUME_NAME" \
              --window-size 640 420 \
              --icon-size 100 \
              --icon "${APP_NAME}.app" 170 190 \
              --app-drop-link 470 190 \
              "dist/${DMG_NAME}" \
              "$DMG_ROOT"
          done

      - name: Package notices and checksums
        shell: bash
        run: |
          python -c "import shutil; shutil.make_archive('dist/release-notices-${{ matrix.platform }}', 'zip', 'build/release-notices')"
          python -c "import hashlib, pathlib; root = pathlib.Path('dist'); files = sorted(p for p in root.iterdir() if p.is_file()); (root / 'SHA256SUMS-${{ matrix.platform }}.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n' for p in files), encoding='utf-8')"

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-release-assets
          retention-days: 7
          path: |
            dist/*
            !dist/*.app/**
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-release-assets"
          path: release-assets
          merge-multiple: true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            Windows-first release candidate. Linux and macOS arm64 builds are experimental.
            Do not publish this draft until the release checklist and LGPL/model redistribution review are complete.
            Downloads are unsigned. Verify SHA-256 checksums before running.
        env:
          GITHUB_TOKEN: ${{ github.token }}
