name: Tests and publication checks

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan history locally with checksum-verified Gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP"
          gh release download v8.30.1 --repo gitleaks/gitleaks \
            --pattern gitleaks_8.30.1_linux_x64.tar.gz \
            --pattern gitleaks_8.30.1_checksums.txt
          grep '  gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks_8.30.1_checksums.txt | sha256sum --check -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz
          ./gitleaks git "$GITHUB_WORKSPACE" --log-opts="--all" --redact --no-banner

  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-14]
    env:
      QT_QPA_PLATFORM: ${{ matrix.os == 'ubuntu-24.04' && 'xcb' || 'offscreen' }}
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            colab_session_viewer/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install locked Windows dependencies
        if: runner.os == 'Windows'
        run: python -m pip install -r requirements-windows-py312.lock
      - name: Install other-platform dependencies
        if: runner.os != 'Windows'
        run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python tools/prepare_release.py --assets
      - run: python tools/check_publication.py
      - name: Verify Linux Qt and OpenGL runtime
        if: runner.os == 'Linux'
        run: |
          plugin=$(python -c "from PySide6.QtCore import QLibraryInfo; print(QLibraryInfo.path(QLibraryInfo.LibraryPath.PluginsPath) + '/platforms/libqxcb.so')")
          ldd "$plugin"
          xvfb-run -a python -c "import cv2; from PySide6.QtWidgets import QApplication; from PySide6.QtGui import QOpenGLContext; app = QApplication([]); context = QOpenGLContext(); assert context.create(), 'Could not create an OpenGL context'; print('Qt platform:', app.platformName())"
      - name: Python tests (Linux virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -q --junitxml=test-results.xml
      - name: Python tests
        if: runner.os != 'Linux'
        run: python -m pytest -q --junitxml=test-results.xml
      - run: node --test colab_session_viewer/viewer.test.cjs
      - name: Compile AirPods helper
        if: runner.os == 'macOS'
        working-directory: providers/airpods/swift_src
        run: swift build
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: test-results.xml
          retention-days: 7
          if-no-files-found: warn
